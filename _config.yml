title: "Charlie's Tech Blog"
name: Charlie
description: Cyber Security student sharing homelab projects and IT troubleshooting.
url: "https://doctoten.github.io"
baseurl: ""
timezone: Australia/Brisbane
lang: en
permalink: /:year/:month/:day/:title/
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-feed
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Charlie
header_pages:
  - about.md
  - projects.md

# Set a valid uploaded image path here to enable a background photo.
background_image: ""
